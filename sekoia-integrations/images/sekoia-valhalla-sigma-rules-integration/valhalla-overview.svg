<text x="80" y="460" font-family="'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#E2E4E8">from our threat research</text>
<text x="80" y="520" font-family="'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8C929B">No key yet? The demo key</text>
<text x="80" y="548" font-family="'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8C929B">gives you the community feed.</text>
