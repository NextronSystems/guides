<text x="80" y="150" font-family="'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="60" fill="#F0F1F3" font-weight="700">Where Nextron Sigma rules meet your events</text>
<text x="80" y="200" font-family="'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="29" fill="#9A9EA6">Sigma rules come in from Nextron, events from your own sources. Sekoia checks every event against the rules you enable.</text>
