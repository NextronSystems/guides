<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to run the integration</title>
  <desc id="desc">The integration polls the THOR Cloud REST API at the configured Interval and sends THOR events to the Elastic Cloud deployment. In the Agent-based option, you install an Elastic Agent on one host, which also gets its agent policy from Fleet Server. In the Elastic Managed Integration option, Elastic runs the collector for you.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .bg { fill: #ffffff; }
    .zn { fill: #f3f4f6; stroke: #d5d9df; }
    .zt { fill: #e7f6f2; stroke: #a3dacb; }
    .zb { fill: #edf3fe; stroke: #b4cbf5; }
    .n  { fill: #ffffff; stroke: #8a94a3; stroke-width: 1.25; }
    .nt { fill: #ffffff; stroke: #12806a; stroke-width: 1.25; }
    .nb { fill: #ffffff; stroke: #3b6fd4; stroke-width: 1.25; }
    .z  { font-size: 12.5px; font-weight: 600; fill: #52606d; }
    .t  { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .s  { font-size: 13px; fill: #52606d; text-anchor: middle; }
    .l  { font-size: 12px; fill: #52606d; text-anchor: middle; }
    .e  { fill: none; stroke: #52606d; stroke-width: 1.5; marker-end: url(#arrow); }
    .d  { stroke-dasharray: 5 4; }
    .ah { fill: #52606d; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .bg { fill: #0d1117; }
      .zn { fill: #161b22; stroke: #30363d; }
      .zt { fill: #0c2925; stroke: #1f6f5e; }
      .zb { fill: #101d36; stroke: #2c5299; }
      .n  { fill: #0d1117; stroke: #6e7681; }
      .nt { fill: #0d1117; stroke: #47c2a8; }
      .nb { fill: #0d1117; stroke: #6ea0f7; }
      .z, .s, .l { fill: #a3aeb9; }
      .e  { stroke: #a3aeb9; }
      .ah { fill: #a3aeb9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="900" height="290" rx="10"/>

  <!-- Zones -->
  <rect class="zt" x="14"  y="88"  width="150" height="112" rx="8"/>
  <rect class="zn" x="300" y="14"  width="290" height="122" rx="8"/>
  <rect class="zn" x="300" y="154" width="290" height="122" rx="8"/>
  <rect class="zb" x="690" y="14"  width="196" height="262" rx="8"/>
  <text class="z" x="26"  y="110">THOR Cloud</text>
  <text class="z" x="316" y="36">Option A: Agent-based</text>
  <text class="z" x="316" y="176">Option B: Elastic Managed Integration</text>
  <text class="z" x="704" y="36">Elastic Cloud deployment</text>

  <!-- Edges -->
  <path class="e" d="M152 144 H205 V84 H316"/>
  <path class="e" d="M152 164 H205 V224 H316"/>
  <path class="e d" d="M574 70 H704"/>
  <path class="e" d="M574 100 H640 V196 H704"/>
  <path class="e" d="M574 232 H704"/>

  <!-- Nodes -->
  <rect class="nt" x="26" y="122" width="126" height="66" rx="6"/>
  <text class="t" x="89" y="150">REST API</text>
  <text class="s" x="89" y="170">scan reports</text>

  <rect class="n" x="316" y="46" width="258" height="76" rx="6"/>
  <text class="t" x="445" y="74">Elastic Agent</text>
  <text class="s" x="445" y="94">you install it on one host, in the</text>
  <text class="s" x="445" y="111">integration's own agent policy</text>

  <rect class="n" x="316" y="186" width="258" height="76" rx="6"/>
  <text class="t" x="445" y="214">Collector</text>
  <text class="s" x="445" y="234">Elastic runs it for you,</text>
  <text class="s" x="445" y="251">so there is nothing to install</text>

  <rect class="nb" x="704" y="46" width="168" height="56" rx="6"/>
  <text class="t" x="788" y="70">Fleet Server</text>
  <text class="s" x="788" y="89">agent policies</text>

  <rect class="nb" x="704" y="170" width="168" height="92" rx="6"/>
  <text class="t" x="788" y="208">Ingest pipeline</text>
  <text class="s" x="788" y="228">and data stream</text>

  <!-- Edge labels -->
  <text class="l" x="252" y="60">polled at</text>
  <text class="l" x="252" y="76">the Interval</text>
  <text class="l" x="252" y="200">polled at</text>
  <text class="l" x="252" y="216">the Interval</text>
  <text class="l" x="640" y="62">agent policy</text>
  <rect class="bg" x="600" y="139" width="80" height="20"/>
  <text class="l" x="640" y="153">THOR events</text>
  <text class="l" x="640" y="224">THOR events</text>
</svg>
