<svg xmlns="http://www.w3.org/2000/svg" width="900" height="328" viewBox="0 0 900 328" role="img" aria-labelledby="title desc">
  <title id="title">THOR Cloud to Elastic data flow</title>
  <desc id="desc">The THOR Cloud Launcher uploads the scan report to THOR Cloud. The integration polls the THOR Cloud REST API and sends THOR events to the ingest pipeline of the Elastic Cloud deployment, which indexes them into a data stream that Kibana reads.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .bg { fill: #ffffff; }
    .zn { fill: #f3f4f6; stroke: #d5d9df; }
    .zt { fill: #e7f6f2; stroke: #a3dacb; }
    .zb { fill: #edf3fe; stroke: #b4cbf5; }
    .n  { fill: #ffffff; stroke: #8a94a3; stroke-width: 1.25; }
    .nt { fill: #ffffff; stroke: #12806a; stroke-width: 1.25; }
    .nb { fill: #ffffff; stroke: #3b6fd4; stroke-width: 1.25; }
    .z  { font-size: 12.5px; font-weight: 600; fill: #52606d; }
    .t  { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .s  { font-size: 13px; fill: #52606d; text-anchor: middle; }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #52606d; text-anchor: middle; }
    .l  { font-size: 12px; fill: #52606d; text-anchor: middle; }
    .e  { fill: none; stroke: #52606d; stroke-width: 1.5; marker-end: url(#arrow); }
    .ah { fill: #52606d; }
    .bd { fill: #1f2933; }
    .bn { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .bg { fill: #0d1117; }
      .zn { fill: #161b22; stroke: #30363d; }
      .zt { fill: #0c2925; stroke: #1f6f5e; }
      .zb { fill: #101d36; stroke: #2c5299; }
      .n  { fill: #0d1117; stroke: #6e7681; }
      .nt { fill: #0d1117; stroke: #47c2a8; }
      .nb { fill: #0d1117; stroke: #6ea0f7; }
      .z, .s, .m, .l { fill: #a3aeb9; }
      .e  { stroke: #a3aeb9; }
      .ah { fill: #a3aeb9; }
      .bd { fill: #e6edf3; }
      .bn { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="900" height="328" rx="10"/>

  <!-- Zones -->
  <rect class="zn" x="14"  y="14"  width="232" height="128" rx="8"/>
  <rect class="zt" x="322" y="14"  width="232" height="128" rx="8"/>
  <rect class="zb" x="640" y="14"  width="246" height="128" rx="8"/>
  <rect class="zb" x="14"  y="186" width="872" height="128" rx="8"/>
  <text class="z" x="30"  y="36">Hosts you scan</text>
  <text class="z" x="338" y="36">Nextron THOR Cloud</text>
  <text class="z" x="654" y="36">Collector (one copy)</text>
  <text class="z" x="30"  y="208">Elastic Cloud deployment</text>

  <!-- Edges -->
  <path class="e" d="M230 88 H338"/>
  <path class="e" d="M538 88 H654"/>
  <path class="e" d="M763 128 V220"/>
  <path class="e" d="M654 260 H596"/>
  <path class="e" d="M326 260 H268"/>

  <!-- Nodes -->
  <rect class="n" x="30" y="48" width="200" height="80" rx="6"/>
  <text class="t" x="130" y="78">THOR Cloud Launcher</text>
  <text class="s" x="130" y="98">runs the THOR scan on</text>
  <text class="s" x="130" y="115">Windows, Linux, macOS</text>

  <rect class="nt" x="338" y="48" width="200" height="80" rx="6"/>
  <text class="t" x="438" y="78">THOR Cloud</text>
  <text class="s" x="438" y="98">stores the scan reports,</text>
  <text class="s" x="438" y="115">serves the REST API</text>

  <rect class="nb" x="654" y="48" width="218" height="80" rx="6"/>
  <text class="t" x="763" y="78">THOR Cloud integration</text>
  <text class="s" x="763" y="98">on one Elastic Agent, or as an</text>
  <text class="s" x="763" y="115">Elastic Managed Integration</text>

  <rect class="nb" x="654" y="220" width="218" height="80" rx="6"/>
  <text class="t" x="763" y="250">Ingest pipeline</text>
  <text class="s" x="763" y="270">parses, normalizes,</text>
  <text class="s" x="763" y="287">maps to ECS</text>

  <rect class="nb" x="326" y="220" width="270" height="80" rx="6"/>
  <text class="t" x="461" y="248">Data stream</text>
  <text class="m" x="461" y="268">logs-nextron_thor_apt_scanner</text>
  <text class="m" x="461" y="285">.thor_forwarding-default</text>

  <rect class="nb" x="30" y="220" width="238" height="80" rx="6"/>
  <text class="t" x="149" y="250">Kibana</text>
  <text class="s" x="149" y="270">dashboard, Discover,</text>
  <text class="s" x="149" y="287">detection rules</text>

  <!-- Step badges -->
  <circle class="bd" cx="284" cy="88" r="11"/><text class="bn" x="284" y="92.5">1</text>
  <text class="l" x="284" y="116">upload</text>
  <circle class="bd" cx="597" cy="88" r="11"/><text class="bn" x="597" y="92.5">2</text>
  <text class="l" x="597" y="116">poll</text>
  <circle class="bd" cx="763" cy="164" r="11"/><text class="bn" x="763" y="168.5">3</text>
  <text class="l" x="822" y="168">THOR events</text>
  <circle class="bd" cx="625" cy="260" r="11"/><text class="bn" x="625" y="264.5">4</text>
  <text class="l" x="625" y="288">index</text>
  <circle class="bd" cx="297" cy="260" r="11"/><text class="bn" x="297" y="264.5">5</text>
  <text class="l" x="297" y="288">read</text>
</svg>
